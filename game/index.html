<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUSTLINE — Tactical FPS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1626; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #f2ede4; }
  #game-canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* ---- HUD ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #topbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: center;
    background: rgba(10, 8, 16, 0.55); border: 1px solid rgba(242, 237, 228, 0.25); border-radius: 6px; padding: 6px 16px; }
  #timer { font-size: 26px; font-weight: 700; color: #f2ede4; min-width: 64px; text-align: center; }
  #timer.low { color: #ff5a4e; }
  #score { font-size: 20px; font-weight: 700; color: #ffc46a; }
  #round { font-size: 13px; letter-spacing: 2px; color: #b8b0a4; }
  #objective { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: 1px;
    color: #ffd27a; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #bomb-status { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 700;
    letter-spacing: 1px; color: #7dff8a; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #bomb-status.danger { color: #ff5a4e; }
  #site-label { position: absolute; bottom: 118px; left: 24px; font-size: 12px; letter-spacing: 2px; color: #b8b0a4; }
  #bottom-left { position: absolute; left: 24px; bottom: 22px; display: flex; gap: 16px; align-items: flex-end; }
  .stat { background: rgba(10, 8, 16, 0.55); border: 1px solid rgba(242, 237, 228, 0.25); border-radius: 6px; padding: 8px 14px; }
  .stat .label { font-size: 10px; letter-spacing: 2px; color: #b8b0a4; }
  .stat .value { font-size: 30px; font-weight: 700; line-height: 1; }
  #health.low { color: #ff5a4e; }
  #bottom-right { position: absolute; right: 24px; bottom: 22px; text-align: right; }
  #ammo-box { background: rgba(10, 8, 16, 0.55); border: 1px solid rgba(242, 237, 228, 0.25); border-radius: 6px; padding: 8px 16px; }
  #ammo { font-size: 34px; font-weight: 700; }
  #reserve { font-size: 16px; color: #b8b0a4; }
  #money { margin-top: 8px; font-size: 20px; font-weight: 700; color: #7dff8a; }
  #slots { margin-top: 8px; display: flex; gap: 6px; justify-content: flex-end; }
  .slot { font-size: 11px; padding: 3px 8px; border: 1px solid rgba(242, 237, 228, 0.3); border-radius: 4px; color: #b8b0a4; }
  .slot.active { color: #111; background: #ffc46a; border-color: #ffc46a; font-weight: 700; }
  .slot.empty { color: #ff5a4e; }
  #killfeed { position: absolute; top: 14px; right: 20px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .kill-row { background: rgba(10, 8, 16, 0.6); border-radius: 4px; padding: 4px 10px; font-size: 13px; transition: opacity 0.8s; }
  .kill-row.fade { opacity: 0; }
  .kill-row .killer { color: #7dff8a; font-weight: 700; }
  .kill-row .kill-weapon { color: #ffc46a; margin: 0 8px; }
  .kill-row .victim { color: #ff8a7a; font-weight: 700; }

  /* Crosshair: four lines whose gap follows spread. */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 8px; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #f2ede4; box-shadow: 0 0 2px #000; }
  #crosshair::before { left: calc(-1px); top: calc(-1 * var(--gap) - 8px); width: 2px; height: 8px; }
  #crosshair::after { left: calc(-1 * var(--gap) - 8px); top: -1px; width: 8px; height: 2px; }
  #crosshair .ch-b, #crosshair .ch-r { position: absolute; background: #f2ede4; box-shadow: 0 0 2px #000; }
  #crosshair .ch-b { left: -1px; top: var(--gap); width: 2px; height: 8px; }
  #crosshair .ch-r { left: var(--gap); top: -1px; width: 8px; height: 2px; }
  #crosshair .ch-dot { position: absolute; left: -1.5px; top: -1.5px; width: 3px; height: 3px; background: #f2ede4; border-radius: 50%; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; left: 12px; top: 0; width: 2px; height: 26px; background: #f2ede4; }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.head::before, #hitmarker.head::after { background: #ff5a4e; }
  #hitmarker.show { animation: hitpop 0.3s ease-out; }
  @keyframes hitpop { 0% { opacity: 1; transform: scale(1.4); } 100% { opacity: 0; transform: scale(0.9); } }
  #damage-dir { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; opacity: 0; }
  #damage-dir::before { content: ""; position: absolute; left: 50%; top: -6px; margin-left: -22px; border-left: 22px solid transparent;
    border-right: 22px solid transparent; border-bottom: 26px solid rgba(255, 90, 78, 0.85); transform: rotate(var(--rot, 0deg)); transform-origin: 22px 66px; }
  #damage-dir.show { animation: dmgfade 0.9s ease-out; }
  @keyframes dmgfade { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Plant / defuse progress. */
  #plant-bar { position: absolute; left: 50%; bottom: 170px; transform: translateX(-50%); width: 280px; text-align: center; }
  #plant-label { font-size: 13px; letter-spacing: 2px; margin-bottom: 6px; color: #ffd27a; }
  #plant-track { height: 8px; background: rgba(10, 8, 16, 0.7); border: 1px solid rgba(242, 237, 228, 0.4); border-radius: 4px; overflow: hidden; }
  #plant-fill { height: 100%; width: 0%; background: #ffc46a; }

  /* Round banner. */
  #banner { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity 0.3s; }
  #banner.show { opacity: 1; }
  #banner-title { font-size: 44px; font-weight: 800; letter-spacing: 3px; text-shadow: 0 2px 12px #000; }
  #banner.vanguard #banner-title { color: #7db8ff; }
  #banner.ember #banner-title { color: #ff9a5e; }
  #banner-sub { font-size: 16px; color: #f2ede4; text-shadow: 0 1px 4px #000; margin-top: 6px; }

  /* Buy menu. */
  #buy-menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; max-width: 92vw;
    background: rgba(12, 10, 18, 0.92); border: 1px solid rgba(255, 196, 106, 0.5); border-radius: 8px; padding: 18px 20px; pointer-events: auto; }
  #buy-menu h2 { font-size: 18px; letter-spacing: 3px; color: #ffc46a; margin-bottom: 4px; }
  #buy-menu .buy-hint { font-size: 12px; color: #b8b0a4; margin-bottom: 12px; }
  .buy-row { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 5px; cursor: pointer; font-size: 14px; }
  .buy-row:hover { background: rgba(255, 196, 106, 0.15); }
  .buy-row.poor { opacity: 0.45; }
  .buy-row.bought { background: rgba(125, 255, 138, 0.25); }
  .buy-row.denied { background: rgba(255, 90, 78, 0.25); }
  .buy-key { display: inline-block; min-width: 22px; text-align: center; font-weight: 700; color: #111; background: #ffc46a; border-radius: 3px; padding: 1px 0; }
  .buy-name { font-weight: 700; }
  .buy-note { flex: 1; color: #b8b0a4; font-size: 12px; }
  .buy-price { color: #7dff8a; font-weight: 700; }

  /* Start / match-end overlay. */
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20, 14, 32, 0.55) 0%, rgba(10, 8, 16, 0.88) 100%); cursor: pointer; text-align: center; padding: 20px; }
  #overlay-title { font-size: 64px; font-weight: 800; letter-spacing: 10px; color: #ffc46a; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8); }
  #overlay-sub { font-size: 16px; color: #f2ede4; max-width: 560px; margin-top: 12px; line-height: 1.5; }
  #overlay-hint { font-size: 13px; color: #b8b0a4; margin-top: 26px; letter-spacing: 1px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <span id="round">ROUND 1 / 9</span>
    <span id="timer">1:40</span>
    <span id="score">0 — 0</span>
  </div>
  <div id="objective"></div>
  <div id="bomb-status"></div>
  <div id="site-label"></div>
  <div id="killfeed"></div>
  <div id="bottom-left">
    <div class="stat"><div class="label">HEALTH</div><div class="value" id="health">100</div></div>
    <div class="stat"><div class="label">ARMOR</div><div class="value" id="armor">—</div></div>
  </div>
  <div id="bottom-right">
    <div id="ammo-box"><span id="ammo">30</span><span id="reserve"> / 120</span></div>
    <div id="money">$800</div>
    <div id="slots"></div>
  </div>
  <div id="crosshair"><span class="ch-b"></span><span class="ch-r"></span><span class="ch-dot"></span></div>
  <div id="hitmarker"></div>
  <div id="damage-dir"></div>
  <div id="plant-bar" class="hidden"><div id="plant-label"></div><div id="plant-track"><div id="plant-fill"></div></div></div>
  <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="buy-menu" class="hidden">
    <h2>BUY MENU</h2>
    <div class="buy-hint">Keys 1–5 or click to buy. B closes. Your pistol and rifle are always issued.</div>
    <div id="buy-list"></div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div id="overlay-title">DUSTLINE</div>
  <div id="overlay-sub"></div>
  <div id="overlay-hint"></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
